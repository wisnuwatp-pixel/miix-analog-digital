<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Miix Analog Digital</title>
  <link rel="icon" type="image/svg+xml" href="/miix-analog-digital/logo.svg" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0e0a08;
      --surface: #1a1410;
      --border: #2a2218;
      --text: #e8e0d4;
      --text-dim: rgba(232,224,212,0.4);
      --text-muted: rgba(232,224,212,0.2);
      --cyan: #00dbc2;
      --cyan-dim: rgba(0,219,194,0.15);
      --honey: #d4a843;
    }
    html { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(165deg, #0e0a08 0%, #141010 40%, #1a1410 100%);
      background-image: radial-gradient(circle, rgba(0,219,194,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      padding: 2rem;
    }
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-cyan { width: 400px; height: 400px; background: rgba(0,219,194,0.06); top: 20%; left: 30%; }
    .glow-honey { width: 300px; height: 300px; background: rgba(212,168,67,0.04); bottom: 20%; right: 25%; }
    .container { position: relative; z-index: 1; text-align: center; max-width: 600px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(0,219,194,0.2);
      background: rgba(0,219,194,0.05);
      padding: 6px 14px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--cyan);
      margin-bottom: 2rem;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e74c3c;
      box-shadow: 0 0 8px rgba(231,76,60,0.6);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .code {
      font-size: clamp(6rem, 18vw, 14rem);
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: -0.04em;
      color: rgba(232,224,212,0.06);
      user-select: none;
      margin-bottom: 1.5rem;
    }
    .title {
      font-size: 1.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }
    .terminal {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--cyan);
      background: rgba(0,219,194,0.03);
      border: 1px solid rgba(0,219,194,0.1);
      border-radius: 6px;
      padding: 16px 20px;
      text-align: left;
      margin-bottom: 2.5rem;
      line-height: 1.8;
    }
    .terminal .prompt { color: #96b88c; }
    .terminal .error { color: #c4734e; }
    .terminal .dim { color: var(--text-muted); }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: rgba(0,219,194,0.1);
      border: 1px solid rgba(0,219,194,0.3);
      color: var(--cyan);
    }
    .btn-primary:hover {
      background: var(--cyan);
      color: var(--bg);
      box-shadow: 0 0 30px rgba(0,219,194,0.2);
    }
    .btn-secondary {
      background: rgba(232,224,212,0.05);
      border: 1px solid rgba(232,224,212,0.1);
      color: var(--text-dim);
    }
    .btn-secondary:hover {
      background: rgba(232,224,212,0.1);
      color: var(--text);
      border-color: rgba(232,224,212,0.2);
    }
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(0,219,194,0.05);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
    }
    .footer a { color: var(--text-dim); text-decoration: none; transition: color 0.2s; }
    .footer a:hover { color: var(--cyan); }
  </style>
</head>
<body>
  <div class="glow glow-cyan"></div>
  <div class="glow glow-honey"></div>

  <div class="container">
    <div class="badge">
      <span class="badge-dot"></span>
      Error 404 — Route Not Found
    </div>

    <div class="code">404</div>

    <h1 class="title">Page Not Found</h1>

    <div class="terminal">
      <span class="prompt">$</span> miix --route=requested<br>
      <span class="error">✖ ERR_PATH_NOT_FOUND</span><br>
      <span class="dim">→ The requested path does not exist in this system.</span><br>
      <span class="dim">→ Check the URL or return to the home directory.</span>
    </div>

    <div class="actions">
      <a href="/miix-analog-digital/" class="btn btn-primary">
        ← Return Home
      </a>
      <a href="/miix-analog-digital/#identity" class="btn btn-secondary">
        Explore Platform
      </a>
    </div>
  </div>

  <div class="footer">
    <span>Miix Analog Digital</span>
    <a href="/miix-analog-digital/">Good Ideas, Well Mixed.</a>
  </div>
</body>
</html>
